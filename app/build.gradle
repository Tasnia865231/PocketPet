plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'      // Firebase: turns app/google-services.json into app settings
}

android {
    namespace 'com.example.pocketpet'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.pocketpet"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.0')
    implementation 'androidx.core:core:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'
    // ---- Firebase ----
    // The BoM (Bill of Materials) picks matching versions for every Firebase library, so we list them WITHOUT versions.
    implementation platform('com.google.firebase:firebase-bom:32.2.3')
    implementation 'com.google.firebase:firebase-auth'          // accounts (register / log in / UID)
    implementation 'com.google.firebase:firebase-database'      // live online/offline status + community activity
    implementation 'com.google.firebase:firebase-firestore'     // permanent player profile (level, coins, dates)
}
